<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card with Logo - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #DC2626;
            overflow: hidden;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        /* Image Section */
        .product-image {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .discount-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #DC2626;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Content Section */
        .product-content {
            padding: 16px;
        }

        /* Service Name with Logo */
        .service-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .service-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid #E2E8F0;
            overflow: hidden;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-logo .logo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .service-name {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #DC2626;
            line-height: 1.3;
        }

        /* Price Section */
        .price-section {
            margin-bottom: 16px;
        }

        .current-price {
            font-size: 24px;
            font-weight: bold;
            color: #DC2626;
            margin-bottom: 4px;
        }

        .original-price {
            font-size: 16px;
            color: #94A3B8;
            text-decoration: line-through;
        }

        /* Add to Cart Button */
        .add-to-cart-btn {
            width: 100%;
            background: #DC2626;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .add-to-cart-btn:hover {
            background: #991B1B;
            transform: scale(1.02);
        }

        .add-to-cart-btn:active {
            transform: scale(0.98);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .product-card {
                max-width: 100%;
            }

            .service-logo {
                width: 40px;
                height: 40px;
            }

            .service-name {
                font-size: 16px;
            }

            .current-price {
                font-size: 20px;
            }
        }

        /* Alternative: Square Logo Style */
        .service-logo.square {
            border-radius: 8px;
        }

        /* Alternative: Rounded Square Logo Style */
        .service-logo.rounded-square {
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <!-- Product Card with Logo -->
    <div class="product-card">
        <!-- Image Section -->
        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3?w=400&h=300&fit=crop" alt="Wedding Reception">
            <div class="discount-badge">10% OFF</div>
        </div>

        <!-- Content Section -->
        <div class="product-content">
            <!-- Service Name with Logo -->
            <div class="service-header">
                <!-- Option 1: Circular Logo with Image -->
                <div class="service-logo">
                    <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&h=100&fit=crop" alt="Brand Logo">
                </div>

                <!-- Option 2: Circular Logo with Placeholder (Uncomment to use) -->
                <!-- <div class="service-logo">
                    <div class="logo-placeholder">BR</div>
                </div> -->

                <!-- Option 3: Square Logo (Uncomment to use) -->
                <!-- <div class="service-logo square">
                    <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&h=100&fit=crop" alt="Brand Logo">
                </div> -->

                <!-- Option 4: Rounded Square Logo (Uncomment to use) -->
                <!-- <div class="service-logo rounded-square">
                    <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&h=100&fit=crop" alt="Brand Logo">
                </div> -->

                <div class="service-name">Demo Reception Wedding</div>
            </div>

            <!-- Price Section -->
            <div class="price-section">
                <div class="current-price">₹9,000.00</div>
                <div class="original-price">₹10,000.00</div>
            </div>

            <!-- Add to Cart Button -->
            <button class="add-to-cart-btn">ADD TO CART</button>
        </div>
    </div>
